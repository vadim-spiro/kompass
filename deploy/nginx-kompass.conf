  # >>> kompass (kompass/deploy): its own container on this network, public under /kompass/.
  # Resolved per request, so this nginx still starts when Kompass is down (it answers 502 then).
  location = /kompass { absolute_redirect off; return 301 /kompass/; }
  location /kompass/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kompass kompass-live:8787;
    rewrite ^/kompass/(.*)$ /$1 break;
    proxy_pass http://$kompass;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;       # server-sent events: the live replay and the assistant stream
    proxy_read_timeout 300s;   # LLM calls are slow
    client_max_body_size 5m;
  }
  # <<< kompass
