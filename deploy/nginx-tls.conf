# HTTPS for Kompass on VM port 443, public as https://130.83.85.181:44443 (self-signed certificate).
server {
  listen 443 ssl;
  ssl_certificate     /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;

  include /etc/nginx/kompass.conf;

  # The app lives under /kompass/; old links to the root land there.
  location / {
    absolute_redirect off;
    return 302 /kompass$request_uri;
  }
}
