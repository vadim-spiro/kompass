<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kompass demo edit</title>
    <!--
      One frame of the Kompass demo video at a time. render.mjs opens this page in headless Chrome,
      hands it the timeline from edit.mjs (window.setup) and calls window.renderAt(t) for every frame.
      To look at single frames: node demo/video/render.mjs --stills=12.5,40
    -->
    <style>
      :root {
        --navy-950: #071431;
        --navy-900: #0c2257;
        --navy: #1650b0;
        --sun: #ffe500;
        --violet: #6d43d1;
        --ring: linear-gradient(90deg, #6d43d1, #1650b0, #ffe500, #0f7c86, #6d43d1);
        --font: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy-950);
      }
      body {
        font-family: var(--font);
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      canvas.full {
        position: absolute;
        left: 0;
        top: 0;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .abs {
        position: absolute;
        left: 0;
        top: 0;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }

      /* The app window */
      #winWrap {
        perspective: 2200px;
        perspective-origin: 960px 380px;
      }
      .win {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 800px;
        transform-origin: 0 0;
        border-radius: 12px;
        overflow: hidden;
        background: #f4f5f7;
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.07);
      }
      .win img {
        display: block;
        width: 1280px;
        height: 800px;
      }

      /* Cursors */
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .cursor svg {
        position: absolute;
        left: -3px;
        top: -2px;
        overflow: visible;
      }
      .ghost .pill {
        position: absolute;
        left: 19px;
        top: 19px;
        white-space: nowrap;
        border-radius: 999px;
        background: #6d43d1;
        padding: 3px 8px 4px;
        font: 600 11px/1 var(--font);
        color: #fff;
        box-shadow: 0 2px 6px rgba(20, 10, 60, 0.35);
      }
      .ripple {
        position: absolute;
        left: 0;
        top: 0;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        border: 3px solid var(--violet);
      }
      .ripple.human {
        border-color: rgba(7, 20, 49, 0.75);
      }

      /* Callouts on the app */
      .ring {
        position: absolute;
        left: 0;
        top: 0;
        border: 3px solid var(--sun);
        border-radius: 14px;
        box-shadow:
          0 0 0 6px rgba(255, 229, 0, 0.16),
          0 0 34px rgba(255, 229, 0, 0.35);
      }
      .tag {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        border-radius: 999px;
        background: var(--sun);
        padding: 11px 18px 12px 16px;
        font: 700 25px/1 var(--font);
        color: var(--navy-950);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .tag.violet {
        background: var(--violet);
        color: #fff;
      }
      .tag.white {
        background: #fff;
        color: var(--navy-950);
      }
      .tag.navy {
        background: var(--navy-900);
        color: #fff;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.14);
      }

      /* Captions */
      #cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        display: flex;
        justify-content: center;
      }
      #cap span {
        max-width: 1500px;
        border-radius: 14px;
        background: rgba(7, 20, 49, 0.84);
        padding: 9px 20px 11px;
        text-align: center;
        font: 600 29px/1.3 var(--font);
        color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }

      /* Type */
      .kw {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1;
        transform-origin: 0 85.5%;
      }
      .grad {
        background: var(--ring);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sun {
        color: var(--sun);
      }
      .mute {
        color: rgba(255, 255, 255, 0.5);
      }
      .label {
        font: 600 26px/1 var(--font);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      .glass {
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.16),
          0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .notif {
        display: flex;
        width: 640px;
        align-items: center;
        gap: 22px;
        padding: 22px 26px;
        box-sizing: border-box;
      }
      .notif .ic {
        display: grid;
        width: 66px;
        height: 66px;
        flex: none;
        place-items: center;
        border-radius: 17px;
        background: var(--navy-900);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      .notif .tt {
        font: 700 29px/1.2 var(--font);
      }
      .notif .bd {
        margin-top: 3px;
        font: 400 24px/1.3 var(--font);
        color: rgba(255, 255, 255, 0.72);
      }
      .notif .tm {
        align-self: flex-start;
        margin-left: auto;
        font: 500 21px/1.4 var(--font);
        color: rgba(255, 255, 255, 0.55);
      }
      .mail {
        width: 660px;
        box-sizing: border-box;
        border-radius: 26px;
        background: #fff;
        padding: 28px 32px 32px;
        color: #0b1430;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .mail .from {
        display: flex;
        align-items: center;
        gap: 16px;
        font: 600 24px/1 var(--font);
      }
      .mail .av {
        display: grid;
        width: 50px;
        height: 50px;
        place-items: center;
        border-radius: 50%;
        background: var(--navy);
        font: 700 24px/1 var(--font);
        color: #fff;
      }
      .mail .time {
        margin-left: auto;
        font: 500 21px/1 var(--font);
        color: #69708a;
      }
      .mail .subj {
        margin-top: 22px;
        font: 800 41px/1.18 var(--font);
        letter-spacing: -0.015em;
      }
      .mail .subj span {
        background-image: linear-gradient(transparent 62%, var(--sun) 62%);
        background-repeat: no-repeat;
        background-size: 0% 100%;
      }
      .mail .bar {
        margin-top: 16px;
        height: 14px;
        border-radius: 7px;
        background: #e7e9f0;
      }
      .strike {
        position: absolute;
        height: 11px;
        border-radius: 6px;
        background: var(--sun);
        transform-origin: 0 50%;
        box-shadow: 0 0 24px rgba(255, 229, 0, 0.5);
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
        padding: 18px 28px 18px 22px;
        font: 650 40px/1 var(--font);
      }
      .node {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .node .big {
        display: grid;
        width: 150px;
        height: 150px;
        place-items: center;
      }
      .node .t1 {
        font: 700 34px/1.1 var(--font);
      }
      .node .t2 {
        font: 500 24px/1.2 var(--font);
        color: rgba(255, 255, 255, 0.6);
      }
      .packet {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        padding: 8px 15px 9px;
        font: 600 20px/1 var(--font);
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      .mark {
        display: grid;
        place-items: center;
        border-radius: 22%;
        background: var(--navy-900);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.14),
          0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .wordmark {
        font: 800 150px/1 var(--font);
        letter-spacing: -0.04em;
      }
      .tile-label {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 999px;
        background: rgba(7, 20, 49, 0.88);
        padding: 9px 16px 10px;
        font: 700 22px/1 var(--font);
        color: #fff;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="bg" class="full" width="1920" height="1080"></canvas>
    <div id="scenesBack" class="layer"></div>
    <div id="winWrap" class="layer"></div>
    <div id="scenes" class="layer"></div>
    <div id="ov" class="layer"></div>
    <div id="cap"></div>
    <script src="compose.js"></script>
  </body>
</html>
